<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ساعة الحروف والتشكيل</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#fdf6ec;
    --bg2:#f3e9d7;
    --ink:#2b2540;
    --panel:#ffffff;
    --panel-border:#eadfc9;
    --accent-letter:#2b2540;
    --accent-diac:#e2572b;
    --diac-tile:#ffd9ad;
    --diac-tile-active:#ffb85c;
    --shadow: 0 10px 30px rgba(43,37,64,.15);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{
    margin:0; padding:0; min-height:100%;
    background: radial-gradient(circle at 50% 0%, var(--bg2), var(--bg1) 60%);
    color:var(--ink);
    font-family:'Cairo', 'Amiri Quran', 'Segoe UI', Tahoma, Arial, sans-serif;
    overflow-x:hidden;
  }
  .app{
    max-width:560px;
    margin:0 auto;
    padding: 14px 14px 34px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  header{
    text-align:center;
    margin-bottom: 6px;
  }
  header h1{
    font-size: clamp(20px, 5.5vw, 28px);
    margin: 4px 0 2px;
    font-weight:800;
  }
  header p{
    margin:0;
    font-size: 13px;
    color:#7a7191;
  }

  /* ---------- Result card ---------- */
  .result-card{
    width:100%;
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:22px;
    box-shadow:var(--shadow);
    padding: 14px 16px;
    margin: 14px 0 10px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  .result-main{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    flex-shrink:0;
  }
  .result-big{
    font-family:'Amiri Quran', 'Amiri', 'Traditional Arabic', serif;
    font-size: 60px;
    font-weight:400;
    line-height:1;
    min-width:70px;
    text-align:center;
    color:var(--ink);
  }
  .play-btn{
    border:none;
    background:var(--diac-tile);
    color:#7a4315;
    width:32px;
    height:32px;
    border-radius:50%;
    font-size:15px;
    line-height:1;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0;
    transition: transform .12s ease, background .15s ease;
  }
  .play-btn:active{ transform:scale(0.88); }
  .play-btn.speaking{ background:var(--accent-diac); color:#fff; }
  .play-btn[hidden]{ display:none; }
  .result-info{
    flex:1;
    text-align:center;
  }
  .result-info .row{
    font-size:14px;
    color:#6d6483;
    margin:2px 0;
  }
  .result-info .row b{
    color:var(--ink);
    font-weight:700;
  }
  .result-info .letter-name{ color:var(--accent-letter); }
  .result-info .diac-name{ color:var(--accent-diac); }
  #readAs{
    font-family:'Amiri Quran', 'Amiri', 'Traditional Arabic', serif;
    font-weight:400;
    font-size:16px;
  }

  .example-card{
    width:100%;
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:18px;
    box-shadow:var(--shadow);
    padding:12px 16px;
    margin:10px 0 4px;
    text-align:center;
  }
  .example-card[hidden]{ display:none; }
  .example-label{
    font-size:12px;
    color:#a49bb8;
    margin-bottom:4px;
  }
  .example-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
  }
  .example-word{
    font-family:'Amiri Quran', 'Amiri', 'Traditional Arabic', serif;
    font-weight:400;
    font-size:32px;
    color:var(--ink);
  }

  /* ---------- Clock ---------- */
  .clock-wrap{
    position:relative;
    width:min(94vw, 460px);
    aspect-ratio:1/1;
    margin: 6px auto 8px;
    touch-action:none;
    user-select:none;
  }
  .clock-face{
    position:absolute;
    inset:0;
    border-radius:50%;
    background: radial-gradient(circle, #ffffff 0%, #fbf5ea 62%, #f4ead4 100%);
    box-shadow: inset 0 0 0 2px #fff, var(--shadow);
  }
  .ring-guide{
    position:absolute;
    border-radius:50%;
    border:1.5px dashed rgba(43,37,64,.10);
    top:50%; left:50%;
    transform:translate(-50%,-50%);
  }
  .tile{
    position:absolute;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:9px;
    font-family:'Amiri Quran', 'Amiri', 'Traditional Arabic', serif;
    font-weight:400;
    cursor:pointer;
    transform:translate(-50%,-50%);
    transition: transform .15s ease, box-shadow .15s ease, filter .15s ease;
    box-shadow: 0 2px 5px rgba(0,0,0,.15);
    color:#fff;
  }
  .tile.letter-tile{
    width:10.6%;
    aspect-ratio:1/1;
    font-size: clamp(13px, 3.6vw, 18px);
  }
  .tile.diac-tile{
    width:13%;
    aspect-ratio:1/1;
    background:var(--diac-tile);
    color:#7a4315;
    font-size: clamp(14px, 4vw, 20px);
  }
  .tile.active{
    filter:brightness(1.08);
    box-shadow: 0 0 0 3px #fff, 0 0 0 5.5px currentColor, 0 4px 10px rgba(0,0,0,.25);
    transform:translate(-50%,-50%) scale(1.14);
    z-index:5;
  }
  .tile.letter-tile.active{ box-shadow: 0 0 0 3px #fff, 0 0 0 5.5px var(--accent-letter), 0 4px 10px rgba(0,0,0,.25); }
  .tile.diac-tile.active{ background:var(--diac-tile-active); box-shadow: 0 0 0 3px #fff, 0 0 0 5.5px var(--accent-diac), 0 4px 10px rgba(0,0,0,.25); }

  .hand{
    position:absolute;
    top:50%; left:50%;
    transform-origin:50% 100%;
    border-radius:6px;
    transform: translate(-50%,-100%) rotate(0deg);
    transition: transform .35s cubic-bezier(.34,1.56,.64,1);
    pointer-events:none;
    z-index:3;
  }
  .hand.dragging{ transition:none; }
  .hand-letter{
    width: 3.2%;
    height:41%;
    background: linear-gradient(var(--accent-letter), #4a3f70);
    box-shadow:0 2px 6px rgba(0,0,0,.35);
  }
  .hand-diacritic{
    width:2.4%;
    height:25%;
    background: linear-gradient(var(--accent-diac), #ff8a5c);
    box-shadow:0 2px 6px rgba(0,0,0,.35);
  }
  .hub{
    position:absolute;
    top:50%; left:50%;
    width:9%;
    aspect-ratio:1/1;
    background: radial-gradient(circle, #fff 30%, #2b2540 32%, #2b2540 100%);
    border-radius:50%;
    transform:translate(-50%,-50%);
    z-index:4;
    box-shadow:0 2px 8px rgba(0,0,0,.3);
  }

  .legend{
    display:flex;
    gap:16px;
    justify-content:center;
    margin: 6px 0 2px;
    font-size:13px;
    color:#6d6483;
    flex-wrap:wrap;
  }
  .legend span{
    display:inline-flex;
    align-items:center;
    gap:6px;
  }
  .dot{ width:12px; height:12px; border-radius:50%; display:inline-block; }
  .dot.letter{ background:var(--accent-letter); }
  .dot.diac{ background:var(--accent-diac); }

  .hint{
    text-align:center;
    font-size:12.5px;
    color:#a49bb8;
    margin-top:4px;
    max-width:420px;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>🕐 ساعة الحروف والتشكيل</h1>
    <p>حرّك العقربين أو اضغط على الحرف والتشكيل مباشرة</p>
  </header>

  <div class="result-card">
    <div class="result-main">
      <div class="result-big" id="resultBig">بَ</div>
      <button type="button" id="playLetter" class="play-btn" aria-label="نطق">🔊</button>
    </div>
    <div class="result-info">
      <div class="row">الحرف: <b class="letter-name" id="letterName">ب</b></div>
      <div class="row">التشكيل: <b class="diac-name" id="diacName">فتحة</b></div>
      <div class="row">القراءة: <b id="readAs">بَ</b></div>
    </div>
  </div>

  <div class="clock-wrap" id="clockWrap">
    <div class="clock-face"></div>
    <div class="ring-guide" id="outerGuide"></div>
    <div class="ring-guide" id="innerGuide"></div>
    <div id="lettersRing"></div>
    <div id="diacriticsRing"></div>
    <div class="hand hand-letter" id="handLetter"></div>
    <div class="hand hand-diacritic" id="handDiacritic"></div>
    <div class="hub"></div>
  </div>

  <div class="legend">
    <span><i class="dot letter"></i>العقرب الكبير = الحرف</span>
    <span><i class="dot diac"></i>العقرب الصغير = التشكيل</span>
  </div>
  <p class="hint">اسحب أي عقرب حول الساعة، أو اضغط مباشرة على أي مربع حرف بالخارج أو مربع تشكيل بالداخل.</p>

  <div class="example-card" id="exampleCard" hidden>
    <div class="example-label">مثال من القرآن الكريم</div>
    <div class="example-row">
      <div class="example-word" id="exampleWord"></div>
      <button type="button" id="playExample" class="play-btn" aria-label="نطق المثال">🔊</button>
    </div>
  </div>
</div>

<script>
(function(){
  const LETTERS = ['أ','ب','ت','ة','ث','ج','ح','خ','د','ذ','ر','ز','س','ش','ص','ض','ط','ظ','ع','غ','ف','ق','ك','ل','م','ن','ه','و','ي'];

  // Example word per letter, indexed like DIACRITICS (fath, damm, kasr, sukun,
  // shadda, tanwin fath, tanwin damm, tanwin kasr). null = no confident
  // Quranic example. Drawn mostly from short, widely-memorized surahs
  // (al-Fatiha, al-Ikhlas, al-Falaq, an-Nas, al-Kawthar, al-Kafirun, an-Nasr,
  // al-Masad, Quraysh, al-Fil) plus a handful of very well-known verses.
  const EXAMPLES = {
    'أ': ['أَحَد','أُمَّةٍ',null,'رَأْس',null,'خَطَأً','أَحَدٌ',null],
    'ب': ['بَشَر','بُيُوت','بِسْمِ','يَبْسُطُ','رَبَّنَا','تَوَّابًا','كِتَابٌ','لَهَبٍ'],
    'ت': ['تَبَّتْ','امْرَأَتُهُ','الْبَيْتِ','الْفَتْحُ','حَتَّىٰ','بَغْتَةً','بَيِّنَاتٌ','تَفَاوُتٍ'],
    'ث': ['ثَمَنًا','ثُمَّ','الْمَبْثُوثِ','مِثْلُكُمْ','يُثَبِّتُ','حَدِيثًا',null,'حَدِيثٍ'],
    'ج': ['جَاءَ','جُوعٍ','الْجِنَّةِ','يَجْعَلْ','سِجِّيلٍ','أَفْوَاجًا',null,'زَوْجٍ'],
    'ح': ['الْحَمْدُ','مَفَاتِحُ','الرَّحِيمِ','الرَّحْمَٰنِ',null,'رُوحًا','فَرَوْحٌ','بِرُوحٍ'],
    'خ': ['خَلَقَ','يَدْخُلُونَ','خِتَامُهُ','فَأَخْرَجَ',null,'شَيْخًا',null,null],
    'د': ['يَدَا','دُونِ','الدِّينِ','يَلِدْ','أَشُدَّهُ','أَحَدًا','أَحَدٌ','حَاسِدٍ'],
    'ذ': ['إِذَا','نُذُرِ','الَّذِي','إِذْ','لَّذَّةٍ',null,null,null],
    'ر': ['رَبَّنَا','رُسُلًا','صُدُورِ','وَانْحَرْ','شَرِّ','نَارًا','نُورٌ','خَيْرٍ'],
    'ز': ['جَزَاءً','زُيِّنَ','زِينَتَكُمْ','رِزْقًا','تُعَزِّرُوهُ','خُبْزًا','كَنزٌ','بِعَزِيزٍ'],
    'س': ['فَسَبِّحْ','يُوَسْوِسُ','غَاسِقٍ','بِسْمِ','السَّمَاءِ','نَفْسًا',null,'نَفْسٍ'],
    'ش': ['شَرِّ','شُرَكَاءُ','بِشِقِّ','يَشْكُرُونَ','الشِّتَاءِ','فِرَاشًا','عَرْشٌ','قُرَيْشٍ'],
    'ص': ['فَصَلِّ','صُدُورِ','بَصِيرٌ','نَصْرُ','الصِّرَاطَ','خَالِصًا',null,null],
    'ض': ['الْأَرْضَ','الْمَغْضُوبِ','الْأَرْضِ','تَضْلِيلٍ','الضَّالِّينَ','مَرَضًا','مَرَضٌ','بَعْضٍ'],
    'ط': ['الصِّرَاطَ','طُوبَىٰ','خَطِيئَتُهُ','أَطْعَمَهُم','فَاطَّلَعَ','وَسَطًا',null,null],
    'ظ': ['نَظَرَ','انظُرْ','ظِلَالٍ','يَظْلِمُونَ',null,'حِفْظًا',null,null],
    'ع': ['عَلَىٰ','أَعُوذُ','نَسْتَعِينُ','نَعْبُدُ',null,'سَمِيعًا','سَمِيعٌ','جُوعٍ'],
    'غ': ['غَيْرِ','غُرَابًا','بَالِغِيهِ','أَغْنَىٰ',null,null,null,null],
    'ف': ['فَعَلَ','كُفُوًا','فِي','أَفْوَاجًا','النَّفَّاثَاتِ','ضَعِيفًا','خَوْفٌ','خَوْفٍ'],
    'ق': ['خَلَقَ','قُلْ','الْحَرِيقِ','خَلَقْنَا','الْحَقُّ','رِزْقًا','حَقٌّ','غَاسِقٍ'],
    'ك': ['كَانَ','يَكُن','مَالِكِ','يَكْتُب','بَكَّةَ','مُلْكًا','مِسْكٌ','مَلِيكٍ'],
    'ل': ['لَمْ','مَالُهُ','لِلَّهِ','قُلْ','الضَّالِّينَ','رُسُلًا','حَبْلٌ','تَضْلِيلٍ'],
    'م': ['مَا','تَعْلَمُونَ','بِسْمِ','الْحَمْدُ','حَمَّالَةَ','رَحِيمًا','رَحِيمٌ','عَظِيمٍ'],
    'ن': ['نَعْبُدُ','نُورٌ','الدِّينِ','أَنْعَمْتَ','النَّاسِ','حُسْنًا','مُّبِينٌ','مُّبِينٍ'],
    'ه': ['لَهَبٍ','اللَّهُ','اللَّهِ','اهْدِنَا',null,'كَرْهًا',null,null],
    'و': ['هُوَ','وُجُوهَكُمْ','يُوَسْوِسُ','يَوْمِ','تَوَّابًا','كُفُوًا','عَدُوٌّ','عَدُوٍّ'],
    'ي': ['يَدَا','يُولَدْ',null,'عَلَيْهِمْ','إِيَّاكَ','عَلِيًّا','عَلِيٌّ',null],
    'ة': ['حَمَّالَةَ','الْجَنَّةُ','الْجِنَّةِ',null,null,'سَاعَةً','آتِيَةٌ','بِحِجَارَةٍ'],
  };

  const DIACRITICS = [
    { name:'فتحة',        mark:'َ' },
    { name:'ضمة',         mark:'ُ' },
    { name:'كسرة',        mark:'ِ' },
    { name:'سكون',        mark:'ۡ' },
    { name:'شدة',         mark:'ّ' },
    { name:'تنوين فتح',   mark:'ً' },
    { name:'تنوين ضم',    mark:'ٌ' },
    { name:'تنوين كسر',   mark:'ٍ' },
  ];

  const LETTER_COUNT = LETTERS.length;
  const DIAC_COUNT = DIACRITICS.length;
  const LETTER_STEP = 360 / LETTER_COUNT;
  const DIAC_STEP = 360 / DIAC_COUNT;
  const TANWIN_FATH_INDEX = DIACRITICS.findIndex(d => d.name === 'تنوين فتح');

  function combineLetterDiacritic(letter, diacIndex){
    const diac = DIACRITICS[diacIndex];
    if(diacIndex === TANWIN_FATH_INDEX && letter !== 'ة' && letter !== 'أ'){
      return letter + 'ا' + diac.mark;
    }
    return letter + diac.mark;
  }

  const OUTER_R = 42;   // % radius for letters ring
  const INNER_R = 26;   // % radius for diacritics ring

  const lettersRing = document.getElementById('lettersRing');
  const diacriticsRing = document.getElementById('diacriticsRing');
  const handLetter = document.getElementById('handLetter');
  const handDiacritic = document.getElementById('handDiacritic');
  const clockWrap = document.getElementById('clockWrap');
  const outerGuide = document.getElementById('outerGuide');
  const innerGuide = document.getElementById('innerGuide');

  outerGuide.style.width = outerGuide.style.height = (OUTER_R*2) + '%';
  innerGuide.style.width = innerGuide.style.height = (INNER_R*2) + '%';

  const letterColor = (i) => `hsl(${Math.round(i * (360/LETTER_COUNT))} 62% 52%)`;

  function polar(radiusPct, angleDeg){
    const rad = (angleDeg - 90) * Math.PI / 180;
    return {
      left: 50 + radiusPct * Math.cos(rad),
      top: 50 + radiusPct * Math.sin(rad)
    };
  }

  const letterTiles = [];
  LETTERS.forEach((ch, i) => {
    const angle = i * LETTER_STEP;
    const pos = polar(OUTER_R, angle);
    const el = document.createElement('div');
    el.className = 'tile letter-tile';
    el.style.left = pos.left + '%';
    el.style.top = pos.top + '%';
    el.style.background = letterColor(i);
    el.textContent = ch;
    el.dataset.index = i;
    el.addEventListener('click', () => selectLetter(i, true));
    lettersRing.appendChild(el);
    letterTiles.push(el);
  });

  const diacTiles = [];
  DIACRITICS.forEach((d, i) => {
    const angle = i * DIAC_STEP;
    const pos = polar(INNER_R, angle);
    const el = document.createElement('div');
    el.className = 'tile diac-tile';
    el.style.left = pos.left + '%';
    el.style.top = pos.top + '%';
    el.textContent = 'ـ' + d.mark;
    el.dataset.index = i;
    el.addEventListener('click', () => selectDiac(i, true));
    diacriticsRing.appendChild(el);
    diacTiles.push(el);
  });

  let letterIndex = 1; // ب
  let diacIndex = 0;   // فتحة

  const resultBig = document.getElementById('resultBig');
  const letterNameEl = document.getElementById('letterName');
  const diacNameEl = document.getElementById('diacName');
  const readAsEl = document.getElementById('readAs');
  const exampleCard = document.getElementById('exampleCard');
  const exampleWordEl = document.getElementById('exampleWord');
  const playLetterBtn = document.getElementById('playLetter');
  const playExampleBtn = document.getElementById('playExample');

  /* ---------- Speech (Web Speech API) ---------- */
  const synth = window.speechSynthesis;
  let arabicVoice = null;

  function pickArabicVoice(){
    if(!synth) return null;
    const voices = synth.getVoices();
    return voices.find(v => v.lang && v.lang.toLowerCase().startsWith('ar')) || null;
  }

  if(synth){
    arabicVoice = pickArabicVoice();
    synth.addEventListener('voiceschanged', () => { arabicVoice = pickArabicVoice(); });
  } else {
    playLetterBtn.hidden = true;
    playExampleBtn.hidden = true;
  }

  function speak(text, btn){
    if(!synth || !text) return;
    synth.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    if(arabicVoice) utter.voice = arabicVoice;
    utter.lang = arabicVoice ? arabicVoice.lang : 'ar-SA';
    utter.rate = 0.8;
    utter.onstart = () => btn.classList.add('speaking');
    utter.onend = () => btn.classList.remove('speaking');
    utter.onerror = () => btn.classList.remove('speaking');
    synth.speak(utter);
  }

  if(synth){
    playLetterBtn.addEventListener('click', () => speak(readAsEl.textContent, playLetterBtn));
    playExampleBtn.addEventListener('click', () => speak(exampleWordEl.textContent, playExampleBtn));
  }

  function refreshExample(letter, diacIndex){
    const word = (EXAMPLES[letter] || [])[diacIndex];
    if(word){
      exampleWordEl.textContent = word;
      exampleCard.hidden = false;
    } else {
      exampleCard.hidden = true;
    }
  }

  function updateResult(){
    const letter = LETTERS[letterIndex];
    const diac = DIACRITICS[diacIndex];
    const combined = combineLetterDiacritic(letter, diacIndex);
    resultBig.textContent = combined;
    letterNameEl.textContent = letter;
    diacNameEl.textContent = diac.name;
    readAsEl.textContent = combined;
    refreshExample(letter, diacIndex);

    letterTiles.forEach((t, i) => t.classList.toggle('active', i === letterIndex));
    diacTiles.forEach((t, i) => t.classList.toggle('active', i === diacIndex));

    handLetter.style.transform = `translate(-50%,-100%) rotate(${letterIndex * LETTER_STEP}deg)`;
    handDiacritic.style.transform = `translate(-50%,-100%) rotate(${diacIndex * DIAC_STEP}deg)`;
  }

  function selectLetter(i, animate){
    letterIndex = ((i % LETTER_COUNT) + LETTER_COUNT) % LETTER_COUNT;
    if(!animate){ handLetter.classList.add('dragging'); } else { handLetter.classList.remove('dragging'); }
    updateResult();
  }
  function selectDiac(i, animate){
    diacIndex = ((i % DIAC_COUNT) + DIAC_COUNT) % DIAC_COUNT;
    if(!animate){ handDiacritic.classList.add('dragging'); } else { handDiacritic.classList.remove('dragging'); }
    updateResult();
  }

  updateResult();

  /* ---------- Drag interaction ---------- */
  let dragMode = null; // 'letter' | 'diac' | null

  function angleFromCenter(clientX, clientY){
    const rect = clockWrap.getBoundingClientRect();
    const cx = rect.left + rect.width/2;
    const cy = rect.top + rect.height/2;
    const dx = clientX - cx;
    const dy = clientY - cy;
    let deg = Math.atan2(dx, -dy) * 180 / Math.PI;
    if(deg < 0) deg += 360;
    return { deg, dist: Math.hypot(dx,dy) / (rect.width/2) * 50 }; // dist in same % units as radii
  }

  function pointerDown(e){
    const point = e.touches ? e.touches[0] : e;
    const { deg, dist } = angleFromCenter(point.clientX, point.clientY);
    const midR = (OUTER_R + INNER_R) / 2;
    dragMode = dist > midR ? 'letter' : 'diac';
    if(dragMode === 'letter'){ handLetter.classList.add('dragging'); }
    else { handDiacritic.classList.add('dragging'); }
    e.preventDefault();
  }

  function pointerMove(e){
    if(!dragMode) return;
    const point = e.touches ? e.touches[0] : e;
    const { deg } = angleFromCenter(point.clientX, point.clientY);
    if(dragMode === 'letter'){
      handLetter.style.transform = `translate(-50%,-100%) rotate(${deg}deg)`;
      const idx = Math.round(deg / LETTER_STEP) % LETTER_COUNT;
      if(idx !== letterIndex){ letterIndex = idx; updateResultLight(); }
    } else {
      handDiacritic.style.transform = `translate(-50%,-100%) rotate(${deg}deg)`;
      const idx = Math.round(deg / DIAC_STEP) % DIAC_COUNT;
      if(idx !== diacIndex){ diacIndex = idx; updateResultLight(); }
    }
    e.preventDefault();
  }

  function updateResultLight(){
    const letter = LETTERS[letterIndex];
    const diac = DIACRITICS[diacIndex];
    const combined = combineLetterDiacritic(letter, diacIndex);
    resultBig.textContent = combined;
    letterNameEl.textContent = letter;
    diacNameEl.textContent = diac.name;
    readAsEl.textContent = combined;
    refreshExample(letter, diacIndex);
    letterTiles.forEach((t, i) => t.classList.toggle('active', i === letterIndex));
    diacTiles.forEach((t, i) => t.classList.toggle('active', i === diacIndex));
  }

  function pointerUp(){
    if(!dragMode) return;
    handLetter.classList.remove('dragging');
    handDiacritic.classList.remove('dragging');
    dragMode = null;
    updateResult(); // snap hands exactly to selected index with animation
  }

  clockWrap.addEventListener('mousedown', pointerDown);
  window.addEventListener('mousemove', pointerMove);
  window.addEventListener('mouseup', pointerUp);

  clockWrap.addEventListener('touchstart', pointerDown, { passive:false });
  window.addEventListener('touchmove', pointerMove, { passive:false });
  window.addEventListener('touchend', pointerUp);
  window.addEventListener('touchcancel', pointerUp);
})();
</script>
</body>
</html>
